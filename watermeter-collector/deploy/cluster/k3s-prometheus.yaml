# K3s Pi 5 cluster: ALTERNATIVE ingestion path (pick ONE primary —
# running both this and the Talos VMScrapeConfig will duplicate series).
#
# If you choose this path: the K3s Prometheus scrapes the Pi and
# remote-writes ONLY the water-meter job into your Talos VictoriaMetrics,
# so cluster metrics don't double-store. Adjust the remote-write URL to
# your VM ingestion endpoint (VMInsert if clustered, e.g.
# http://vminsert:8480/insert/0/prometheus/api/v1/write; or the
# single-node /api/v1/write path).
#
# kube-prometheus-stack (Helm) values snippet:
#
#   prometheus:
#     prometheusSpec:
#       additionalScrapeConfigs:
#         - job_name: watermeter
#           scrape_interval: 15s
#           static_configs:
#             - targets: ['PI_LAN_IP:9101']
#       remoteWrite:
#         - url: http://VM_INGEST_ENDPOINT/api/v1/write
#           # NOTE: these are the Prometheus *Operator* field names
#           # (camelCase); raw Prometheus config uses snake_case
#           # (write_relabel_configs / source_labels).
#           writeRelabelConfigs:
#             - sourceLabels: [job]
#               regex: watermeter
#               action: keep
#
# Grafana (either cluster): add a datasource of type Prometheus pointing at
# your existing VictoriaMetrics query endpoint (e.g. http://VM_QUERY:8428).
#
# Starter queries:
#   Daily usage:     increase(watermeter_usage_counts_total[1d]) * <volume-per-count>
#   Flow rate:       rate(watermeter_usage_counts_total[5m]) * <volume-per-count> * 60
#   Stall alert:     time() - watermeter_last_message_timestamp_seconds > 300
